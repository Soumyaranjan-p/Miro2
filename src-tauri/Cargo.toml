[package]
name = "miro"
version = "0.1.0"
description = "Miro - a living notch for Windows"
authors = ["Soumyaranjan Parida"]
edition = "2024"

[lib]
name = "miro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Media_Control",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
